[package]
name = "nflow-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Long-running background daemon — Unix socket server, scheduler loop, command handlers"

[[bin]]
name = "nflow-daemon"
path = "src/main.rs"

[dependencies]
nflow-core = { workspace = true }
nflow-claude = { workspace = true }
nflow-git = { workspace = true }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
nix = { version = "0.29", features = ["signal", "process", "fs"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
