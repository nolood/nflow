[package]
name = "nflow-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "TUI client — ratatui + crossterm, connects to daemon via Unix socket"

[[bin]]
name = "nflow-tui"
path = "src/main.rs"

[dependencies]
nflow-core = { workspace = true }
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
